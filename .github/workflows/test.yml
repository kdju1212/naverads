# main 브랜치 보호의 '필수 검사'로 지정할 테스트(docs/SECURITY_OPERATIONS.md 4절). 네이버는 Mock만 쓰고 비밀값은 필요 없다.
name: test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.13 --group local pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 타입 검사는 next build가 한다(따로 tsc를 먼저 돌리면 빌드가 만드는 .next 타입(LayoutProps 등)이 없어 실패)
      - run: npm run lint
      - run: npm test
      - run: npm run build
